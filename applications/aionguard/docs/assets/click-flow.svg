<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">AionGuard: inspect before the destination</title><desc id="desc">One controlled Chromium comparison. Ordinary click sends four local browser HTTP requests to the destination. AionGuard holds navigation, inspects the owned page in a prepared Solari sandbox and shows a warning in 1.98 seconds. The protected browser sends zero destination HTTP requests. No automatic safe-link release is demonstrated.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b9efcc" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="1060" fill="#101813"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="64" y="87" font-size="54" fill="#f1f7f1" font-weight="700">AionGuard</text><text x="400" y="87" font-size="36" fill="#b9efcc" font-weight="400">× Solari</text><text x="1110" y="82" font-size="23" fill="#a8b9aa" font-weight="700">CONTROLLED CLICK DEMO</text><text x="64" y="165" font-size="47" fill="#f1f7f1" font-weight="700">Inspect the link before your browser visits it.</text><text x="64" y="212" font-size="28" fill="#a8b9aa" font-weight="400">The problem: an ordinary click lets the destination reach your browser immediately.</text><path d="M64 254H1536" stroke="#34463b"/><text x="64" y="310" font-size="23" fill="#a8b9aa" font-weight="700">ORDINARY CLICK</text><text x="64" y="371" font-size="32" fill="#f1f7f1" font-weight="700">Click the link</text><path d="M310 360H440" fill="none" stroke="#b9efcc" stroke-width="3" marker-end="url(#arrow)"/><text x="477" y="371" font-size="32" fill="#f1f7f1" font-weight="700">Browser opens destination</text><path d="M949 360H1110" fill="none" stroke="#b9efcc" stroke-width="3" marker-end="url(#arrow)"/><text x="1160" y="375" font-size="88" fill="#f1f7f1" font-weight="700">4</text><text x="1248" y="342" font-size="27" fill="#a8b9aa" font-weight="400">destination</text><text x="1248" y="378" font-size="27" fill="#a8b9aa" font-weight="400">HTTP requests</text><path d="M64 426H1536" stroke="#34463b"/><text x="64" y="477" font-size="23" fill="#b9efcc" font-weight="700">WITH AIONGUARD</text><text x="64" y="532" font-size="24" fill="#b9efcc" font-weight="700">01</text><text x="64" y="577" font-size="30" fill="#f1f7f1" font-weight="700">Click the link</text><text x="64" y="618" font-size="25" fill="#a8b9aa" font-weight="400">Same owned fixture</text><text x="432" y="532" font-size="24" fill="#b9efcc" font-weight="700">02</text><text x="432" y="577" font-size="30" fill="#f1f7f1" font-weight="700">Hold navigation</text><text x="432" y="618" font-size="25" fill="#a8b9aa" font-weight="400">Your browser waits</text><text x="800" y="532" font-size="24" fill="#b9efcc" font-weight="700">03</text><text x="800" y="577" font-size="30" fill="#f1f7f1" font-weight="700">Inspect in Solari</text><text x="800" y="618" font-size="25" fill="#a8b9aa" font-weight="400">Fresh remote browser</text><text x="1168" y="532" font-size="24" fill="#b9efcc" font-weight="700">04</text><text x="1168" y="577" font-size="30" fill="#f1f7f1" font-weight="700">Show the warning</text><text x="1168" y="618" font-size="25" fill="#a8b9aa" font-weight="400">Destination stays held</text><path d="M353 565H408" fill="none" stroke="#b9efcc" stroke-width="3" marker-end="url(#arrow)"/><path d="M721 565H776" fill="none" stroke="#b9efcc" stroke-width="3" marker-end="url(#arrow)"/><path d="M1089 565H1144" fill="none" stroke="#b9efcc" stroke-width="3" marker-end="url(#arrow)"/><text x="432" y="711" font-size="88" fill="#b9efcc" font-weight="700">0</text><text x="514" y="678" font-size="25" fill="#a8b9aa" font-weight="400">local destination</text><text x="514" y="711" font-size="25" fill="#a8b9aa" font-weight="400">HTTP requests</text><text x="1168" y="711" font-size="74" fill="#b9efcc" font-weight="700">1.98 s</text><text x="1168" y="752" font-size="25" fill="#a8b9aa" font-weight="400">click to warning</text><path d="M945 647V784H64" stroke="#34463b" stroke-width="2" fill="none"/><text x="64" y="835" font-size="32" fill="#f1f7f1" font-weight="700">Why Solari? Prepare once. Inspect at click time.</text><text x="64" y="878" font-size="27" fill="#a8b9aa" font-weight="400">The sandbox is ready before the click. Browser setup happens ahead of time.</text><path d="M64 919H1536" stroke="#34463b"/><text x="64" y="961" font-size="25" fill="#a8b9aa" font-weight="400">One owned fixture · one baseline + one protected click · automated Chromium</text><text x="64" y="1005" font-size="25" fill="#b9efcc" font-weight="700">Reproduce it: docs/controlled-click.md</text><text x="881" y="1005" font-size="25" fill="#a8b9aa" font-weight="400">Network counts + timings + screenshots</text></g></svg>