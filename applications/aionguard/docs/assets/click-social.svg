<title id="title">Four requests to zero. A warning in 1.98 seconds.</title><desc id="desc">AionGuard controlled click comparison. Local browser destination HTTP requests fell from four to zero. One click-to-warning run took 1.98 seconds with a Solari sandbox prepared beforehand. The destination stayed held. Evidence: github.com/EXO-Robotics/AionGuard-Solari.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b9efcc" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="900" fill="#101813"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="64" y="87" font-size="54" fill="#f1f7f1" font-weight="700">AionGuard</text><text x="400" y="87" font-size="36" fill="#b9efcc" font-weight="400">× Solari</text><text x="1110" y="82" font-size="23" fill="#a8b9aa" font-weight="700">CONTROLLED CLICK DEMO</text><text x="64" y="165" font-size="47" fill="#f1f7f1" font-weight="700">Inspect the link before your browser visits it.</text><text x="64" y="233" font-size="24" fill="#a8b9aa" font-weight="700">LOCAL DESTINATION HTTP REQUESTS</text><text x="978" y="233" font-size="24" fill="#a8b9aa" font-weight="700">CLICK TO WARNING</text><text x="64" y="414" font-size="165" fill="#b9efcc" font-weight="700">4</text><path d="M205 360H320" fill="none" stroke="#b9efcc" stroke-width="3" marker-end="url(#arrow)"/><text x="359" y="414" font-size="165" fill="#b9efcc" font-weight="700">0</text><text x="978" y="414" font-size="132" fill="#b9efcc" font-weight="700">1.98 s</text><text x="68" y="470" font-size="28" fill="#a8b9aa" font-weight="400">HTTP requests · ordinary vs. AionGuard click</text><text x="978" y="470" font-size="28" fill="#a8b9aa" font-weight="400">One prepared-sandbox run</text><path d="M64 516H1536" stroke="#34463b"/><text x="64" y="578" font-size="33" fill="#f1f7f1" font-weight="700">Click</text><text x="64" y="621" font-size="25" fill="#a8b9aa" font-weight="400">Same owned page</text><text x="432" y="578" font-size="33" fill="#f1f7f1" font-weight="700">Hold</text><text x="432" y="621" font-size="25" fill="#a8b9aa" font-weight="400">Local browser waits</text><text x="800" y="578" font-size="33" fill="#f1f7f1" font-weight="700">Solari inspects</text><text x="800" y="621" font-size="25" fill="#a8b9aa" font-weight="400">Prepared beforehand</text><text x="1168" y="578" font-size="33" fill="#f1f7f1" font-weight="700">Warning</text><text x="1168" y="621" font-size="25" fill="#a8b9aa" font-weight="400">Destination held</text><path d="M353 566H408" fill="none" stroke="#b9efcc" stroke-width="3" marker-end="url(#arrow)"/><path d="M721 566H776" fill="none" stroke="#b9efcc" stroke-width="3" marker-end="url(#arrow)"/><path d="M1089 566H1144" fill="none" stroke="#b9efcc" stroke-width="3" marker-end="url(#arrow)"/><text x="64" y="707" font-size="32" fill="#f1f7f1" font-weight="700">Solari makes the prepared-sandbox approach practical.</text><text x="64" y="752" font-size="27" fill="#a8b9aa" font-weight="400">Browser setup happens before the click. The inspection happens in the sandbox.</text><text x="64" y="817" font-size="24" fill="#a8b9aa" font-weight="400">One controlled Chromium comparison · owned fixture · no automatic safe-link release</text><text x="64" y="861" font-size="25" fill="#b9efcc" font-weight="700">Code + reproducible evidence: github.com/EXO-Robotics/AionGuard-Solari</text></g></svg>